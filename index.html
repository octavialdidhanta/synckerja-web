    <!-- Google Tag Manager: dimuat setelah load + idle agar tidak bersaing dengan LCP / JS utama -->
    <script>
      (function (w, d) {
        function injectGtm() {
          if (d.getElementById("gtm-script")) return;
          w.dataLayer = w.dataLayer || [];
          w.dataLayer.push({ "gtm.start": Date.now(), event: "gtm.js" });
          var s = d.getElementsByTagName("script")[0];
          var j = d.createElement("script");
          j.async = true;
          j.id = "gtm-script";
          j.src = "https://www.googletagmanager.com/gtm.js?id=GTM-5QMCZWGC";
          s.parentNode.insertBefore(j, s);
        }
        function schedule() {
          if ("requestIdleCallback" in w) {
            w.requestIdleCallback(injectGtm, { timeout: 2500 });
          } else {
            w.setTimeout(injectGtm, 1);
          }
        }
        if (d.readyState === "complete") schedule();
        else w.addEventListener("load", schedule, { once: true });
      })(window, document);
    </script>
